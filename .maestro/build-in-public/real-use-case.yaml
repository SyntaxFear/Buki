appId: com.parastashvili.bloombook
---
# Starts from an empty synthetic book on the approved disposable simulator.
- launchApp:
    stopApp: true
- assertVisible: "Scan a drawing"
- tapOn: "Scan a drawing"
- extendedWaitUntil:
    visible: "Capture drawing"
    timeout: 10000
- tapOn: "Show another sample drawing"
- waitForAnimationToEnd
- tapOn: "Capture drawing"
- extendedWaitUntil:
    visible: "Does this look right?"
    timeout: 30000
- tapOn: "Add artwork to sketchpad"
- extendedWaitUntil:
    visible: "Scan a drawing"
    timeout: 30000
- assertVisible: "Choose sketchpad.*"
