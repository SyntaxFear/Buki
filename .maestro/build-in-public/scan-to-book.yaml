appId: com.parastashvili.bloombook
---
# Requires a disposable, already signed-in simulator containing synthetic data only.
# The capture runner foregrounds the app before recording so the clip contains
# only the product interaction, not the iOS relaunch transition.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Scan a drawing"
    timeout: 20000
- tapOn: "Scan a drawing"
- extendedWaitUntil:
    visible: "Capture drawing"
    timeout: 10000
- tapOn: "Show another sample drawing"
- waitForAnimationToEnd
- tapOn: "Capture drawing"
- extendedWaitUntil:
    visible: "Does this look right?"
    timeout: 30000
- tapOn: "Add drawing to sketchpad"
- extendedWaitUntil:
    visible: "Scan a drawing"
    timeout: 30000
- assertVisible: "Choose sketchpad.*"
- waitForAnimationToEnd
